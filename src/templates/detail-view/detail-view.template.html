<template id="ts-detail-view">
  <div class="ts-detail-header">
    <button class="ts-detail-back" @click="backToTable">&larr; Back</button>
    <div class="ts-detail-title">
      <span class="ts-detail-name" v-text="detailDisplay.name"></span>
      <span class="ts-mastery-badge" v-text="detailDisplay.masteryLevel"></span>
    </div>
    <div class="ts-detail-subtitle">
      <span v-text="detailDisplay.area"></span>
      <span class="ts-config-sep">&middot;</span>
      <span v-text="'Level ' + detailDisplay.level"></span>
      <span class="ts-config-sep">&middot;</span>
      <span v-text="detailDisplay.realm"></span>
    </div>
  </div>

  <div class="ts-detail-stats">
    <div class="ts-detail-stat">
      <span class="ts-detail-stat-label">Success Rate</span>
      <span class="ts-detail-stat-value" v-text="detailDisplay.formattedSuccessRate"></span>
    </div>
    <div class="ts-detail-stat">
      <span class="ts-detail-stat-label">XP/hr</span>
      <span class="ts-detail-stat-value" v-text="detailDisplay.formattedXpHr"></span>
    </div>
    <div class="ts-detail-stat">
      <span class="ts-detail-stat-label" v-text="detailDisplay.currencyLabel + '/hr'"></span>
      <span class="ts-detail-stat-value" v-text="detailDisplay.formattedCurrencyHr"></span>
    </div>
    <div class="ts-detail-stat">
      <span class="ts-detail-stat-label">Double</span>
      <span class="ts-detail-stat-value" v-text="detailDisplay.formattedDouble"></span>
    </div>
    <div class="ts-detail-stat">
      <span class="ts-detail-stat-label">Interval</span>
      <span class="ts-detail-stat-value" v-text="detailDisplay.formattedInterval"></span>
    </div>
    <div class="ts-detail-stat">
      <span class="ts-detail-stat-label">Stun</span>
      <span class="ts-detail-stat-value" v-text="detailDisplay.formattedStunDuration"></span>
    </div>
    <div class="ts-detail-stat">
      <span class="ts-detail-stat-label">Actions/hr</span>
      <span class="ts-detail-stat-value" v-text="detailDisplay.formattedActionsHr"></span>
    </div>
    <div class="ts-detail-stat">
      <span class="ts-detail-stat-label">XP/Action</span>
      <span class="ts-detail-stat-value" v-text="detailDisplay.formattedXpPerAction"></span>
    </div>
  </div>

  <div class="ts-detail-section">
    <div class="ts-detail-section-title">Loot Table</div>
    <div class="ts-table-wrap">
      <table class="ts-table">
        <thead>
          <tr>
            <th class="ts-th ts-th--text">Drop</th>
            <th class="ts-th ts-th--text">Type</th>
            <th class="ts-th ts-th--num">Chance</th>
            <th class="ts-th ts-th--num">Qty</th>
            <th class="ts-th ts-th--num">/hour</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="loot in detailDisplay.lootTable" class="ts-row">
            <td class="ts-td ts-td--text" v-text="loot.name"></td>
            <td class="ts-td ts-td--text">
              <span class="ts-loot-category" v-text="loot.categoryLabel"></span>
            </td>
            <td class="ts-td ts-td--num" v-text="loot.formattedChance"></td>
            <td class="ts-td ts-td--num" v-text="loot.formattedQuantity"></td>
            <td class="ts-td ts-td--num" v-text="loot.formattedPerHour"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="ts-detail-section">
    <div class="ts-detail-section-title">Drop Confidence</div>
    <div class="ts-detail-section-desc">Probability of receiving at least one drop in N actions.</div>
    <div class="ts-confidence-controls">
      <div class="ts-confidence-input-group">
        <label class="ts-confidence-label">Attempts:</label>
        <input
          class="ts-confidence-input"
          type="number"
          min="1"
          v-model="confidenceInput"
          @change="applyConfidenceInput"
          @keyup.enter="applyConfidenceInput"
        />
      </div>
      <div class="ts-confidence-presets">
        <button class="ts-confidence-preset" @click="setConfidenceAttempts(100)">100</button>
        <button class="ts-confidence-preset" @click="setConfidenceAttempts(500)">500</button>
        <button class="ts-confidence-preset" @click="setConfidenceAttempts(1000)">1K</button>
        <button class="ts-confidence-preset" @click="setConfidenceAttempts(5000)">5K</button>
        <button class="ts-confidence-preset" @click="setConfidenceAttempts(10000)">10K</button>
        <button class="ts-confidence-preset" @click="setConfidenceAttempts(50000)">50K</button>
      </div>
    </div>
    <div class="ts-table-wrap">
      <table class="ts-table">
        <thead>
          <tr>
            <th class="ts-th ts-th--text">Drop</th>
            <th class="ts-th ts-th--num">Per Action</th>
            <th class="ts-th ts-th--num" v-text="'P(≥1 in ' + confidenceAttempts + ')'"></th>
            <th class="ts-th ts-th--num">50%</th>
            <th class="ts-th ts-th--num">90%</th>
            <th class="ts-th ts-th--num">99%</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="conf in detailDisplay.confidenceTable" class="ts-row">
            <td class="ts-td ts-td--text" v-text="conf.name"></td>
            <td class="ts-td ts-td--num" v-text="conf.formattedChance"></td>
            <td class="ts-td ts-td--num" v-text="conf.formattedProbability"></td>
            <td class="ts-td ts-td--num" v-text="conf.attemptsFor50"></td>
            <td class="ts-td ts-td--num" v-text="conf.attemptsFor90"></td>
            <td class="ts-td ts-td--num" v-text="conf.attemptsFor99"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</template>
