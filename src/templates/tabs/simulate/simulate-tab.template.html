<template id="ts-simulate-tab">
  <div class="ts-config">
    <div class="ts-config-bar">
      <span class="ts-config-heading">Loadout</span>
      <button class="ts-btn ts-btn--secondary" @click="importLoadout" v-text="hasImported ? 'Re-import' : 'Import Character'"></button>
    </div>
    <div class="ts-loadout-layout">
      <div class="ts-loadout-equip">
        <div class="ts-equip-paperdoll ts-equip-paperdoll--readonly">
          <div
            v-for="slot in equipmentSlots"
            class="ts-equip-cell ts-equip-cell--readonly"
            :class="{
              'ts-equip-cell--filled': slot.hasItem,
              'ts-equip-cell--overridden': slot.isOverridden
            }"
            :style="{ gridRow: slot.gridRow + 1, gridColumn: slot.gridCol + 1 }"
          >
            <span class="ts-equip-cell-label" v-text="slot.slotName"></span>
            <img v-if="slot.mediaUrl" :src="slot.mediaUrl" class="ts-item-icon" />
            <span
              class="ts-equip-cell-item"
              :class="{ 'ts-equip-cell-item--empty': !slot.hasItem }"
              v-text="slot.hasItem ? slot.itemName : 'Empty'"
            ></span>
          </div>
        </div>
      </div>
      <div class="ts-loadout-stats">
        <div class="ts-config-section">
          <div class="ts-config-label">Potion</div>
          <div :class="configDisplay.potion === 'None' ? 'ts-config-none' : 'ts-config-value'" v-text="configDisplay.potion"></div>
        </div>
        <div class="ts-config-section">
          <div class="ts-config-label">Prayers</div>
          <div :class="configDisplay.prayerSummary === 'None' ? 'ts-config-none' : 'ts-config-value'" v-text="configDisplay.prayerSummary"></div>
        </div>
        <div class="ts-config-section">
          <div class="ts-config-label">Synergy</div>
          <div :class="configDisplay.synergy === 'None' ? 'ts-config-none' : 'ts-config-value'" v-text="configDisplay.synergy"></div>
        </div>
        <div class="ts-config-section">
          <div class="ts-config-label">Agility</div>
          <div :class="configDisplay.agilitySummary === 'No course loaded' ? 'ts-config-none' : 'ts-config-value'" v-text="configDisplay.agilitySummary"></div>
        </div>
        <div class="ts-config-section">
          <div class="ts-config-label">Character</div>
          <div class="ts-config-stats">
            <span>Level <span v-text="configDisplay.skillLevel"></span></span>
            <span class="ts-config-sep">&middot;</span>
            <span>Abyssal <span v-text="configDisplay.abyssalSkillLevel"></span></span>
            <span class="ts-config-sep">&middot;</span>
            <span>Pool <span v-text="configDisplay.melvorPool"></span></span>
            <span class="ts-config-sep">&middot;</span>
            <span>Abyssal <span v-text="configDisplay.abyssalPool"></span></span>
          </div>
        </div>
        <div class="ts-config-section">
          <div class="ts-config-label">Other Sources</div>
          <div class="ts-config-stats">
            <span v-text="configDisplay.astrologyCount + ' astrology'"></span>
            <span class="ts-config-sep">&middot;</span>
            <span v-text="configDisplay.petCount + ' pets'"></span>
            <span class="ts-config-sep">&middot;</span>
            <span v-text="configDisplay.shopPurchaseCount + ' purchases'"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="ts-table-wrap">
    <table class="ts-table">
      <thead>
        <tr>
          <th class="ts-th ts-th--text" @click="toggleSort('npc')">NPC<span class="ts-sort-indicator" v-text="sortIndicator('npc')"></span></th>
          <th class="ts-th ts-th--text" @click="toggleSort('area')">Area<span class="ts-sort-indicator" v-text="sortIndicator('area')"></span></th>
          <th class="ts-th ts-th--num" @click="toggleSort('level')">Lvl<span class="ts-sort-indicator" v-text="sortIndicator('level')"></span></th>
          <th class="ts-th ts-th--num" @click="toggleSort('xpHr')">XP/hr<span class="ts-sort-indicator" v-text="sortIndicator('xpHr')"></span></th>
          <th class="ts-th ts-th--num" @click="toggleSort('currencyHr')">GP/hr<span class="ts-sort-indicator" v-text="sortIndicator('currencyHr')"></span></th>
          <th class="ts-th ts-th--num" @click="toggleSort('success')">Success<span class="ts-sort-indicator" v-text="sortIndicator('success')"></span></th>
          <th class="ts-th ts-th--num" @click="toggleSort('double')">Double<span class="ts-sort-indicator" v-text="sortIndicator('double')"></span></th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="row in filteredRows" class="ts-row ts-row--clickable" @click="selectTarget(row)">
          <td class="ts-td ts-td--npc">
            <span class="ts-npc-name" v-text="row.target.name"></span>
            <span class="ts-mastery-badge" v-text="row.masteryLevel"></span>
          </td>
          <td class="ts-td ts-td--text" v-text="row.target.area"></td>
          <td class="ts-td ts-td--num" v-text="row.target.level"></td>
          <td class="ts-td ts-td--num" v-text="row.formattedXpHr"></td>
          <td class="ts-td ts-td--num">
            <span v-text="row.formattedCurrencyHr"></span>
            <span class="ts-currency-label" v-text="row.currencyLabel"></span>
          </td>
          <td class="ts-td ts-td--num" v-text="row.formattedSuccess"></td>
          <td class="ts-td ts-td--num" v-text="row.formattedDouble"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="ts-footer">
    <span class="ts-count" v-text="filteredRows.length + ' NPCs'"></span>
  </div>
</template>
