<template id="ts-equipment-tab">
  <div class="ts-equip-tab">
    <div class="ts-equip-paperdoll">
      <div
        v-for="slot in equipmentSlots"
        class="ts-equip-cell"
        :class="{
          'ts-equip-cell--active': selectedSlot === slot.slotId,
          'ts-equip-cell--filled': slot.hasItem,
          'ts-equip-cell--overridden': slot.isOverridden,
          'ts-equip-cell--disabled': slot.disabled
        }"
        :style="{ gridRow: slot.gridRow + 1, gridColumn: slot.gridCol + 1 }"
        @click="slot.disabled ? null : selectSlot(slot.slotId)"
      >
        <span class="ts-equip-cell-label" v-text="slot.slotName"></span>
        <img v-if="slot.mediaUrl" :src="slot.mediaUrl" class="ts-item-icon" />
        <span
          class="ts-equip-cell-item"
          :class="{ 'ts-equip-cell-item--empty': !slot.hasItem }"
          v-text="slot.hasItem ? slot.itemName : 'Empty'"
        ></span>
      </div>
    </div>
    <div class="ts-equip-picker" v-if="selectedSlot">
      <div class="ts-equip-picker-header">
        <span v-text="selectedSlotName"></span>
        <button class="ts-equip-picker-clear" @click="clearSlot">Clear</button>
      </div>
      <div class="ts-equip-picker-list">
        <div class="ts-equip-picker-empty" v-if="!slotOptions.length">No items available for this slot.</div>
        <button
          v-for="option in slotOptions"
          class="ts-equip-picker-item"
          @click="selectItem(option)"
        >
          <span class="ts-picker-item-header">
            <img v-if="option.mediaUrl" :src="option.mediaUrl" class="ts-item-icon--sm" />
            <span class="ts-picker-item-name" v-text="option.itemName"></span>
          </span>
          <span class="ts-picker-item-mods" v-if="option.formattedModifiers" v-text="option.formattedModifiers"></span>
        </button>
      </div>
    </div>
    <div class="ts-equip-picker ts-equip-picker--empty" v-else>
      <span class="ts-equip-picker-placeholder">Select a slot to change equipment.</span>
    </div>
  </div>
  <div class="ts-synergy-panel">
    <div class="ts-config-panel">
      <div class="ts-config-panel-header">
        <span class="ts-config-panel-title">Summoning Synergy</span>
        <button class="ts-config-panel-clear" @click="clearSynergy">Clear</button>
      </div>
      <div class="ts-config-panel-body">
        <div class="ts-config-panel-empty" v-if="!synergyDisplayOptions.length">No thieving synergies found.</div>
        <button
          v-for="syn in synergyDisplayOptions"
          class="ts-config-option"
          :class="{ 'ts-config-option--selected': syn.isSelected }"
          @click="selectSynergy(syn)"
        >
          <span class="ts-config-option-header">
            <img v-if="syn.summon1MediaUrl" :src="syn.summon1MediaUrl" class="ts-item-icon--sm" />
            <img v-if="syn.summon2MediaUrl" :src="syn.summon2MediaUrl" class="ts-item-icon--sm" />
            <span class="ts-config-option-name" v-text="syn.name"></span>
          </span>
          <span class="ts-config-option-desc" v-text="syn.description"></span>
        </button>
      </div>
    </div>
  </div>
  <div class="ts-equip-actions">
    <button class="ts-btn ts-btn--secondary" @click="resetEquipment">Reset Equipment</button>
  </div>
</template>
