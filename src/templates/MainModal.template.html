<template id="ts-modal">
  <div class="ts-overlay" v-show="isOpen" @click.self="setIsOpen">
    <div class="ts-modal">
      <div class="ts-header">
        <h2 class="ts-title">Thieving Simulator</h2>
        <div class="ts-header-actions">
          <div class="ts-realm-tabs" v-if="hasImported && activeTab === 'simulate'">
            <button class="ts-tab" :class="{ 'ts-tab--active': realmFilter === 'all' }" @click="setRealmFilter('all')">All</button>
            <button class="ts-tab" :class="{ 'ts-tab--active': realmFilter === 'melvor' }" @click="setRealmFilter('melvor')">Melvor</button>
            <button class="ts-tab" :class="{ 'ts-tab--active': realmFilter === 'abyssal' }" @click="setRealmFilter('abyssal')">Abyssal</button>
          </div>
          <button class="ts-close" @click="setIsOpen">&times;</button>
        </div>
      </div>
      <div class="ts-modal-content">
        <div class="ts-sidebar" v-if="hasImported">
          <button class="ts-sidebar-tab" :class="{ 'ts-sidebar-tab--active': activeTab === 'simulate' }" @click="setActiveTab('simulate')">
            <svg class="ts-sidebar-icon" viewBox="0 0 20 20" fill="currentColor">
              <rect x="2" y="10" width="4" height="8" rx="1"/>
              <rect x="8" y="6" width="4" height="12" rx="1"/>
              <rect x="14" y="2" width="4" height="16" rx="1"/>
            </svg>
            Sim
          </button>
          <button class="ts-sidebar-tab" :class="{ 'ts-sidebar-tab--active': activeTab === 'equipment' }" @click="setActiveTab('equipment')">
            <svg class="ts-sidebar-icon" viewBox="0 0 20 20" fill="currentColor">
              <path d="M10 1l2 5h5l-4 3 1.5 5L10 11l-4.5 3L7 9 3 6h5z"/>
            </svg>
            Equip
          </button>
          <button class="ts-sidebar-tab" :class="{ 'ts-sidebar-tab--active': activeTab === 'config' }" @click="setActiveTab('config')">
            <svg class="ts-sidebar-icon" viewBox="0 0 20 20" fill="currentColor">
              <path d="M10 2a1.5 1.5 0 011.5 1.5v1.07a5.97 5.97 0 011.82 1.06l.93-.54a1.5 1.5 0 012.06.55l.5.87a1.5 1.5 0 01-.55 2.05l-.93.54a6.02 6.02 0 010 2.1l.93.54a1.5 1.5 0 01.55 2.05l-.5.87a1.5 1.5 0 01-2.06.55l-.93-.54a5.97 5.97 0 01-1.82 1.06v1.07A1.5 1.5 0 0110 18a1.5 1.5 0 01-1.5-1.5v-1.07a5.97 5.97 0 01-1.82-1.06l-.93.54a1.5 1.5 0 01-2.06-.55l-.5-.87a1.5 1.5 0 01.55-2.05l.93-.54a6.02 6.02 0 010-2.1l-.93-.54a1.5 1.5 0 01-.55-2.05l.5-.87a1.5 1.5 0 012.06-.55l.93.54A5.97 5.97 0 018.5 4.57V3.5A1.5 1.5 0 0110 2zm0 5.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z"/>
            </svg>
            Config
          </button>
        </div>
        <div class="ts-modal-body">
          <div v-if="activeTab === 'simulate'">
            <div class="ts-config" v-if="!hasImported">
              <div class="ts-config-empty">
                <p>Import your character's loadout to begin simulation.</p>
                <button class="ts-btn ts-btn--primary" @click="importLoadout">Import Character</button>
              </div>
            </div>
            <div class="ts-config" v-if="hasImported">
              <div class="ts-config-bar">
                <span class="ts-config-heading">Loadout</span>
                <button class="ts-btn ts-btn--secondary" @click="importLoadout">Re-import</button>
              </div>
              <div class="ts-config-grid">
                <div class="ts-config-section ts-config-section--wide">
                  <div class="ts-config-label">Equipment</div>
                  <div class="ts-equip-grid" v-if="configDisplay.equipment.length">
                    <div class="ts-equip-entry" v-for="entry in configDisplay.equipment">
                      <span class="ts-equip-slot" v-text="entry.slotName + ':'"></span>
                      <span class="ts-equip-item" v-text="entry.itemName"></span>
                    </div>
                  </div>
                  <div class="ts-config-none" v-else>None</div>
                </div>
                <div class="ts-config-section">
                  <div class="ts-config-label">Potion</div>
                  <div :class="configDisplay.potion === 'None' ? 'ts-config-none' : 'ts-config-value'" v-text="configDisplay.potion"></div>
                </div>
                <div class="ts-config-section">
                  <div class="ts-config-label">Prayers</div>
                  <div :class="configDisplay.prayerSummary === 'None' ? 'ts-config-none' : 'ts-config-value'" v-text="configDisplay.prayerSummary"></div>
                </div>
                <div class="ts-config-section">
                  <div class="ts-config-label">Synergy</div>
                  <div :class="configDisplay.synergy === 'None' ? 'ts-config-none' : 'ts-config-value'" v-text="configDisplay.synergy"></div>
                </div>
                <div class="ts-config-section">
                  <div class="ts-config-label">Agility</div>
                  <div :class="configDisplay.agilitySummary === 'No course loaded' ? 'ts-config-none' : 'ts-config-value'" v-text="configDisplay.agilitySummary"></div>
                </div>
                <div class="ts-config-section ts-config-section--wide">
                  <div class="ts-config-label">Character</div>
                  <div class="ts-config-stats">
                    <span>Level <span v-text="configDisplay.skillLevel"></span></span>
                    <span class="ts-config-sep">&middot;</span>
                    <span>Abyssal <span v-text="configDisplay.abyssalSkillLevel"></span></span>
                    <span class="ts-config-sep">&middot;</span>
                    <span>Pool <span v-text="configDisplay.melvorPool"></span></span>
                    <span class="ts-config-sep">&middot;</span>
                    <span>Abyssal <span v-text="configDisplay.abyssalPool"></span></span>
                  </div>
                </div>
                <div class="ts-config-section ts-config-section--wide">
                  <div class="ts-config-label">Other Sources</div>
                  <div class="ts-config-stats">
                    <span v-text="configDisplay.astrologyCount + ' astrology'"></span>
                    <span class="ts-config-sep">&middot;</span>
                    <span v-text="configDisplay.petCount + ' pets'"></span>
                    <span class="ts-config-sep">&middot;</span>
                    <span v-text="configDisplay.shopPurchaseCount + ' purchases'"></span>
                  </div>
                </div>
              </div>
            </div>
            <div class="ts-table-wrap" v-if="hasImported">
              <table class="ts-table">
                <thead>
                  <tr>
                    <th class="ts-th ts-th--text" @click="toggleSort('npc')">NPC<span class="ts-sort-indicator" v-text="sortIndicator('npc')"></span></th>
                    <th class="ts-th ts-th--text" @click="toggleSort('area')">Area<span class="ts-sort-indicator" v-text="sortIndicator('area')"></span></th>
                    <th class="ts-th ts-th--num" @click="toggleSort('level')">Lvl<span class="ts-sort-indicator" v-text="sortIndicator('level')"></span></th>
                    <th class="ts-th ts-th--num" @click="toggleSort('xpHr')">XP/hr<span class="ts-sort-indicator" v-text="sortIndicator('xpHr')"></span></th>
                    <th class="ts-th ts-th--num" @click="toggleSort('currencyHr')">GP/hr<span class="ts-sort-indicator" v-text="sortIndicator('currencyHr')"></span></th>
                    <th class="ts-th ts-th--num" @click="toggleSort('success')">Success<span class="ts-sort-indicator" v-text="sortIndicator('success')"></span></th>
                    <th class="ts-th ts-th--num" @click="toggleSort('double')">Double<span class="ts-sort-indicator" v-text="sortIndicator('double')"></span></th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="row in filteredRows" class="ts-row">
                    <td class="ts-td ts-td--npc">
                      <span class="ts-npc-name" v-text="row.target.name"></span>
                      <span class="ts-mastery-badge" v-text="row.masteryLevel"></span>
                    </td>
                    <td class="ts-td ts-td--text" v-text="row.target.area"></td>
                    <td class="ts-td ts-td--num" v-text="row.target.level"></td>
                    <td class="ts-td ts-td--num" v-text="row.formattedXpHr"></td>
                    <td class="ts-td ts-td--num">
                      <span v-text="row.formattedCurrencyHr"></span>
                      <span class="ts-currency-label" v-text="row.currencyLabel"></span>
                    </td>
                    <td class="ts-td ts-td--num" v-text="row.formattedSuccess"></td>
                    <td class="ts-td ts-td--num" v-text="row.formattedDouble"></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="ts-footer" v-if="hasImported">
              <span class="ts-count" v-text="filteredRows.length + ' NPCs'"></span>
            </div>
          </div>
          <div class="ts-equip-tab-wrap" v-if="activeTab === 'equipment'">
            <div class="ts-equip-tab">
              <div class="ts-equip-paperdoll">
                <div
                  v-for="slot in equipmentSlots"
                  class="ts-equip-cell"
                  :class="{
                    'ts-equip-cell--active': selectedSlot === slot.slotId,
                    'ts-equip-cell--filled': slot.hasItem,
                    'ts-equip-cell--overridden': slot.isOverridden
                  }"
                  :style="{ gridRow: slot.gridRow + 1, gridColumn: slot.gridCol + 1 }"
                  @click="selectSlot(slot.slotId)"
                >
                  <span class="ts-equip-cell-label" v-text="slot.slotName"></span>
                  <span
                    class="ts-equip-cell-item"
                    :class="{ 'ts-equip-cell-item--empty': !slot.hasItem }"
                    v-text="slot.hasItem ? slot.itemName : 'Empty'"
                  ></span>
                </div>
              </div>
              <div class="ts-equip-picker" v-if="selectedSlot">
                <div class="ts-equip-picker-header">
                  <span v-text="selectedSlotName"></span>
                  <button class="ts-equip-picker-clear" @click="clearSlot">Clear</button>
                </div>
                <div class="ts-equip-picker-list">
                  <div class="ts-equip-picker-empty" v-if="!slotOptions.length">No items available for this slot.</div>
                  <button
                    v-for="option in slotOptions"
                    class="ts-equip-picker-item"
                    @click="selectItem(option)"
                    v-text="option.itemName"
                  ></button>
                </div>
              </div>
              <div class="ts-equip-picker ts-equip-picker--empty" v-else>
                <span class="ts-equip-picker-placeholder">Select a slot to change equipment.</span>
              </div>
            </div>
            <div class="ts-equip-actions">
              <button class="ts-btn ts-btn--secondary" @click="resetEquipment">Reset Equipment</button>
            </div>
          </div>
          <div class="ts-config-tab-wrap" v-if="activeTab === 'config'">
            <div class="ts-config-tab-scroll">
              <!-- Potion selector -->
              <div class="ts-config-panel">
                <div class="ts-config-panel-header">
                  <span class="ts-config-panel-title">Potion</span>
                  <button class="ts-config-panel-clear" @click="clearPotion">Clear</button>
                </div>
                <div class="ts-config-panel-body">
                  <div class="ts-config-panel-empty" v-if="!potionDisplayOptions.length">No thieving potions found.</div>
                  <button
                    v-for="potion in potionDisplayOptions"
                    class="ts-config-option"
                    :class="{ 'ts-config-option--selected': potion.isSelected }"
                    @click="selectPotion(potion)"
                    v-text="potion.itemName"
                  ></button>
                </div>
              </div>

              <!-- Summoning synergy selector -->
              <div class="ts-config-panel">
                <div class="ts-config-panel-header">
                  <span class="ts-config-panel-title">Summoning Synergy</span>
                  <button class="ts-config-panel-clear" @click="clearSynergy">Clear</button>
                </div>
                <div class="ts-config-panel-body">
                  <div class="ts-config-panel-empty" v-if="!synergyDisplayOptions.length">No thieving synergies found.</div>
                  <button
                    v-for="syn in synergyDisplayOptions"
                    class="ts-config-option"
                    :class="{ 'ts-config-option--selected': syn.isSelected }"
                    @click="selectSynergy(syn)"
                  >
                    <span class="ts-config-option-name" v-text="syn.name"></span>
                    <span class="ts-config-option-desc" v-text="syn.description"></span>
                  </button>
                </div>
              </div>

              <!-- Agility course display -->
              <div class="ts-config-panel">
                <div class="ts-config-panel-header">
                  <span class="ts-config-panel-title">Agility Course</span>
                </div>
                <div class="ts-config-panel-body">
                  <div class="ts-config-panel-empty" v-if="!agilitySlots.length">No course loaded.</div>
                  <div
                    v-for="slot in agilitySlots"
                    class="ts-agility-slot"
                    :class="{ 'ts-agility-slot--cleared': slot.isCleared }"
                  >
                    <span class="ts-agility-slot-type" v-text="slot.type === 'obstacle' ? 'Slot ' + slot.slot : 'Pillar'"></span>
                    <span class="ts-agility-slot-name" v-text="slot.name"></span>
                    <button
                      class="ts-agility-slot-clear"
                      @click="clearAgilitySlot(slot)"
                      v-if="!slot.isCleared"
                    >&times;</button>
                    <span class="ts-agility-slot-badge" v-if="slot.isCleared">Cleared</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Reset all overrides -->
            <div class="ts-equip-actions">
              <button
                class="ts-btn ts-btn--primary"
                @click="resetAll"
                v-if="hasAnyOverride"
              >Reset All to Imported</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
